<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WeEuroSA | Weather across Europe and South Africa</title>
    <meta name="description" content="Live weather and a 7-day forecast for cities across Europe and South Africa." />
    <meta name="author" content="Cebo Mlotshwa" />
    <meta name="theme-color" content="#0d1b3d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2232%22 fill=%22%230d1b3d%22/><circle cx=%2226%22 cy=%2226%22 r=%2210%22 fill=%22%23ffc94d%22/><path d=%22M22 46h22a9 9 0 0 0 0-18 12 12 0 0 0-22 4 7 7 0 0 0 0 14z%22 fill=%22%23fff%22/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/master.css" />
    <script defer src="js/cities.js"></script>
    <script defer src="js/main.js"></script>
  </head>

  <body data-sky="day">
    <div class="sky" aria-hidden="true"></div>

    <header class="top">
      <a class="brand" href="./" aria-label="WeEuroSA home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>WeEuroSA<small>You asked: the weather</small></span>
      </a>
      <div class="controls">
        <label class="picker">
          <span class="sr">Choose a city</span>
          <select id="city"></select>
        </label>
        <button class="locate" id="locate" type="button" title="Use my location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
          <span>My location</span>
        </button>
      </div>
    </header>

    <main class="app">
      <section class="now" aria-live="polite">
        <div class="now-main">
          <p class="place"><span id="place">Johannesburg</span><span id="country" class="muted">South Africa</span></p>
          <p class="date" id="date"></p>
          <div class="temp-row">
            <span class="temp" id="temp">--</span>
            <div class="cond">
              <span class="cond-icon" id="icon"></span>
              <span id="cond">Loading</span>
              <span class="muted" id="range"></span>
            </div>
          </div>
        </div>
        <div class="stats">
          <div class="stat"><span class="stat-k">Humidity</span><b id="humidity">--</b><span class="stat-s">Relative, at 2 m</span></div>
          <div class="stat"><span class="stat-k">Wind</span><b id="wind">--</b><span class="stat-s" id="wind-s">--</span></div>
          <div class="stat"><span class="stat-k">Cloud cover</span><b id="cloud">--</b><span class="stat-s" id="cloud-s">--</span></div>
          <div class="stat"><span class="stat-k">Rain</span><b id="rain">--</b><span class="stat-s">Next 3 hours</span></div>
        </div>
      </section>

      <section class="panel">
        <h2>Next 24 hours</h2>
        <div class="hours" id="hours"></div>
      </section>

      <section class="panel">
        <h2>7-day forecast</h2>
        <ol class="days" id="days"></ol>
      </section>

      <p class="status" id="status" role="status"></p>
    </main>

    <footer class="foot">
      <span>Forecast data from 7Timer! &middot; Places from OpenStreetMap</span>
      <span>Built by Cebo Mlotshwa</span>
    </footer>
  </body>
</html>
